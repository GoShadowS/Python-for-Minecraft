name: Probe

# Resolves the real, currently published versions of every dependency this project pins,
# straight from the upstream repositories, and reports whether each pinned version actually
# exists. It exists because the development sandbox has no route to Maven Central,
# maven.fabricmc.net, maven.neoforged.net, the Gradle Plugin Portal or
# piston-meta.mojang.com, so no version may be pinned from memory.
#
# Output is deliberately compact and published as annotations, which stay readable through
# api.github.com:
#   gh api repos/<owner>/<repo>/check-runs/<job-id>/annotations

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml", "tools/ci_annotate.py"]

permissions:
  contents: read

jobs:
  versions:
    name: Upstream version probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe every pinned dependency
        run: |
          # GitHub Actions runs steps with `bash -eo pipefail` by default, and a `grep`
          # with no match returns 1 -- that would abort the probe. Errors are recorded,
          # not fatal.
          set +e
          out=probe.txt
          : > "$out"

          # maven_versions <url> -> all <version> values, one per line
          maven_versions () {
            # Splitting on '<' puts the closing tag on its own line, so the version
            # value is the whole remainder of the line after "version>".
            curl -sS --max-time 60 "$1" 2>/dev/null \
              | tr '<' '\n' | sed -n 's|^version>\(.*\)$|\1|p'
          }

          # check <label> <url> <pinned>
          # Reports: pinned exists? and the newest version. Never fails the step.
          check () {
            local label="$1" url="$2" pinned="$3"
            local all latest verdict
            all=$(maven_versions "$url")
            if [ -z "$all" ]; then
              echo "$label: FETCH FAILED or no <version> entries ($url)" >> "$out"
              return
            fi
            latest=$(echo "$all" | tail -1)
            if [ "$pinned" = "-" ]; then
              verdict="pinned=n/a"
            elif echo "$all" | grep -Fxq "$pinned"; then
              verdict="pinned=$pinned OK"
            else
              verdict="pinned=$pinned MISSING"
            fi
            echo "$label: $verdict; newest=$latest; count=$(echo "$all" | wc -l)" >> "$out"
          }

          M=https://repo1.maven.org/maven2
          F=https://maven.fabricmc.net
          N=https://maven.neoforged.net/releases
          P=https://plugins.gradle.org/m2

          {
            echo "### Minecraft (piston-meta version_manifest_v2)"
            curl -sS --max-time 60 \
              https://piston-meta.mojang.com/mc/game/version_manifest_v2.json 2>/dev/null \
              | tr '{' '\n' | grep -E '"id":"(1\.21\.1|26\.3)"' \
              | sed -n 's/.*"id":"\([^"]*\)".*"releaseTime":"\([^"]*\)".*/  \1  released \2/p'
            echo
          } >> "$out"

          check "fabric-loader"          "$F/net/fabricmc/fabric-loader/maven-metadata.xml"                        "0.20.1"
          check "fabric-api-1.21.1"      "$F/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml"                "0.116.17+1.21.1"
          check "fabric-api-26.3"        "$F/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml"                "0.165.2+26.3"
          check "fabric-loom"            "$F/net/fabricmc/fabric-loom/maven-metadata.xml"                          "1.19"
          check "loom-plugin-marker"     "$P/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml"                 "1.19"
          check "loom-remap-marker"      "$P/net/fabricmc/fabric-loom-remap/net.fabricmc.fabric-loom-remap.gradle.plugin/maven-metadata.xml"     "1.19"
          check "graalvm-polyglot"       "$M/org/graalvm/polyglot/polyglot/maven-metadata.xml"                     "25.5.5"
          check "python-community"       "$M/org/graalvm/polyglot/python-community/maven-metadata.xml"             "25.5.5"
          check "python-embedding"       "$M/org/graalvm/python/python-embedding/maven-metadata.xml"               "-"
          check "slf4j-api"              "$M/org/slf4j/slf4j-api/maven-metadata.xml"                               "2.0.17"
          check "junit-jupiter"          "$M/org/junit/jupiter/junit-jupiter/maven-metadata.xml"                   "5.11.4"
          check "shadow-plugin"          "$P/com/gradleup/shadow/com.gradleup.shadow.gradle.plugin/maven-metadata.xml" "9.2.2"
          check "moddevgradle-portal"    "$P/net/neoforged/moddevgradle/net.neoforged.moddevgradle.gradle.plugin/maven-metadata.xml" "2.0.71"
          check "moddevgradle-neoforged" "$N/net/neoforged/moddevgradle/net.neoforged.moddevgradle.gradle.plugin/maven-metadata.xml" "2.0.71"
          check "neoforge"               "$N/net/neoforged/neoforge/maven-metadata.xml"                            "-"
          check "neoforgespi"            "$N/net/neoforged/neoforgespi/maven-metadata.xml"                         "-"
          check "fancymodloader"         "$N/net/neoforged/fancymodloader/maven-metadata.xml"                      "-"

          {
            echo
            echo "### neoforge: newest per interesting line"
            for prefix in 21.1 26.3; do
              latest=$(maven_versions "$N/net/neoforged/neoforge/maven-metadata.xml" \
                        | grep "^$prefix\." | tail -3 | tr '\n' ' ')
              echo "  $prefix.x newest three: ${latest:-none}"
            done
            echo
            echo "### fabric-api: newest for the two targets"
            for target in "1.21.1" "26.3"; do
              newest=$(maven_versions "$F/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" \
                        | grep -- "+$target\$" | tail -3 | tr '\n' ' ')
              echo "  +$target newest three: ${newest:-none}"
            done
            echo
            echo "### loom plugin markers: newest five"
            echo "  net.fabricmc.fabric-loom: $(maven_versions "$P/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml" | tail -5 | tr '\n' ' ')"
            echo "  net.fabricmc.fabric-loom-remap: $(maven_versions "$P/net/fabricmc/fabric-loom-remap/net.fabricmc.fabric-loom-remap.gradle.plugin/maven-metadata.xml" | tail -5 | tr '\n' ' ')"
          } >> "$out"

          wc -c "$out"
          python3 tools/ci_annotate.py notice "versions" "$out" 6000
      - name: Upload the probe output
        uses: actions/upload-artifact@v4
        with:
          name: version-probe
          path: probe.txt
          if-no-files-found: error
