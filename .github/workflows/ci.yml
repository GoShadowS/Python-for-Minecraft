name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_eula:
        description: >-
          Permit the launch jobs to accept the Minecraft EULA. Off by default: the project
          never accepts the EULA on the repository owner's behalf.
        type: choice
        default: "false"
        options: ["false", "true"]

permissions:
  contents: read

# The four supported combinations. Nothing in this file may assume one toolchain fits all
# of them: Fabric 1.21.1 and NeoForge 1.21.1 need Java 21, the 26.3 combinations need
# Java 25, and the Fabric and NeoForge builds use different Gradle lines.
jobs:
  # Runs everywhere and needs no JDK: this is what the project can verify without a
  # Minecraft toolchain at all.
  python:
    name: Python suite, vendoring and metadata validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Public API and protocol tests
        working-directory: python
        run: python -m unittest discover -s tests -t . -v
      - name: Reproducible dependency vendoring
        run: |
          python tools/vendor_deps.py --check \
            --requirements examples/pyhello-common/requirements.txt \
            --out examples/pyhello-common/python/vendor
      - name: Mod metadata validation
        run: python tools/validate_metadata.py
      - name: Mod metadata validator self-test
        run: python tools/validate_metadata.py --self-test
      - name: Java source consistency check (no JDK needed)
        run: python tools/check_java.py

  # Gradle builds for all four combinations. Successful build is NOT a successful launch:
  # see docs/testing.md for what each cell of the matrix really proves.
  build:
    name: ${{ matrix.platform }} / gradle ${{ matrix.gradle }} / jvm ${{ matrix.gradle_java }} / target ${{ matrix.java }}
    runs-on: ubuntu-latest
    needs: python
    strategy:
      fail-fast: false
      matrix:
        include:
          # gradle_java is the JVM that runs Gradle; java is the bytecode level the
          # artifact targets through options.release. They differ for Fabric 1.21.1
          # because Loom 1.19 refuses to resolve on a JVM older than 25 even though
          # Minecraft 1.21.1 itself runs on Java 21.
          - platform: fabric-1.21.1
            gradle_java: "25"
            java: "21"
            gradle: "9.9.0"
            loader: fabric
          - platform: fabric-26.3
            gradle_java: "25"
            java: "25"
            gradle: "9.9.0"
            loader: fabric
          - platform: neoforge-1.21.1
            gradle_java: "25"
            java: "21"
            gradle: "9.6.1"
            loader: neoforge
          - platform: neoforge-26.3
            gradle_java: "25"
            java: "25"
            gradle: "9.6.1"
            loader: neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.gradle_java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-read-only: false
      - name: Record the toolchain actually in use
        working-directory: platforms/${{ matrix.platform }}
        run: |
          set +e
          {
            echo "### toolchain"
            java -version 2>&1
            echo "JAVA_HOME=${JAVA_HOME}"
            java --list-modules 2>/dev/null | grep -i zipfs \
              || echo "jdk.zipfs: NOT PRESENT in this JVM"
            gradle --version 2>&1 | grep -E "Gradle|Kotlin|JVM|Launcher"
            echo
          } > build.log
      # fabric-26.3 fails inside Loom's Minecraft setup with
      # ProviderNotFoundException: Provider "jar" not found, while fabric-1.21.1 with the
      # same Loom and JVM does not. This step configures and compiles one subproject on its
      # own (--configure-on-demand), which separates "Loom cannot handle this Minecraft
      # version" from "three subprojects sharing one Loom cache interfere".
      - name: "Diagnostic: set up Minecraft for :pyfm-core alone"
        working-directory: platforms/${{ matrix.platform }}
        continue-on-error: true
        run: |
          set +e
          {
            echo "### diagnostic: :pyfm-core:compileJava with --configure-on-demand"
          } >> build.log
          gradle --no-daemon --configure-on-demand --stacktrace --console=plain \
            -I "${GITHUB_WORKSPACE}/tools/diag.init.gradle" \
            :pyfm-core:compileJava 2>&1 | tee -a build.log
          status=${PIPESTATUS[0]}
          {
            echo "diagnostic :pyfm-core:compileJava alone -> exit $status"
            grep '^DIAG' build.log
          } > diag.txt
          python3 "${GITHUB_WORKSPACE}/tools/ci_annotate.py" notice \
            "diagnostic pyfm-core alone: ${{ matrix.platform }}" diag.txt 3000
          if [ "$status" -ne 0 ]; then
            bash "${GITHUB_WORKSPACE}/tools/ci_extract.sh" build.log \
              "diagnostic failure: ${{ matrix.platform }}"
          fi
      # Read-only diagnostic: shadowJar failed on fabric-1.21.1 with
      # "Cannot expand ZIP ... python-community-25.5.5.0.3.pom", so record exactly what the
      # "shade" configuration resolves to before changing any dependency attribute. This
      # step never masks a build failure -- the build steps below still exit with Gradle's
      # own status.
      - name: "Diagnostic: what the shade configuration resolves to"
        working-directory: platforms/${{ matrix.platform }}
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon --console=plain \
            -I "${GITHUB_WORKSPACE}/tools/shade-diag.init.gradle" \
            :pyfm-core:shadeDiag 2>&1 | tee -a build.log
          grep '^SHADEDIAG' build.log > shade.txt
          # The POM of the artifact shadow tried to expand is the primary source on whether
          # it is a real jar or a pom-packaging aggregator.
          {
            echo
            echo "### org.graalvm.polyglot:python-community POM (repo1.maven.org)"
            curl -sS --max-time 60 \
              "https://repo1.maven.org/maven2/org/graalvm/polyglot/python-community/25.5.5.0.3/python-community-25.5.5.0.3.pom" \
              | tr -d '\r' | sed -n '1,120p'
          } >> shade.txt
          python3 "${GITHUB_WORKSPACE}/tools/ci_annotate.py" notice \
            "shade resolution: ${{ matrix.platform }}" shade.txt 6000
      # Minimal reproduction of the fabric-26.3 "Provider jar not found" failure inside the
      # JVM and classloader where it happens. Read-only; the build steps stay fatal.
      - name: "Diagnostic: reproduce the jar FileSystem failure"
        working-directory: platforms/${{ matrix.platform }}
        continue-on-error: true
        run: |
          set +e
          # Root project + --configure-on-demand: Loom aborts the configuration of
          # :pyfm-core on fabric-26.3, so a task there never runs.
          gradle --no-daemon --console=plain --configure-on-demand \
            -I "${GITHUB_WORKSPACE}/tools/jarfs-repro.init.gradle" \
            jarFsRepro 2>&1 | tee -a build.log
          grep '^REPRO' build.log > repro.txt
          python3 "${GITHUB_WORKSPACE}/tools/ci_annotate.py" notice \
            "jar filesystem repro: ${{ matrix.platform }}" repro.txt 4000
      - name: Build the three Python-for-Minecraft components
        working-directory: platforms/${{ matrix.platform }}
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain build 2>&1 | tee -a build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bash "${GITHUB_WORKSPACE}/tools/ci_extract.sh" build.log \
              "build failure: ${{ matrix.platform }}"
          fi
          exit "$status"
      - name: Build the example Python mods
        working-directory: examples/pyhello-client/${{ matrix.platform }}
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain build 2>&1 | tee -a build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bash "${GITHUB_WORKSPACE}/tools/ci_extract.sh" build.log \
              "example build failure: pyhello-client ${{ matrix.platform }}"
          fi
          exit "$status"
      - name: Build the common example Python mod
        working-directory: examples/pyhello-common/${{ matrix.platform }}
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain build 2>&1 | tee -a build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bash "${GITHUB_WORKSPACE}/tools/ci_extract.sh" build.log \
              "example build failure: pyhello-common ${{ matrix.platform }}"
          fi
          exit "$status"
      - name: Inspect the produced jars
        run: |
          set -euo pipefail
          for jar in $(find platforms/${{ matrix.platform }} \
                                examples/pyhello-client/${{ matrix.platform }} \
                                examples/pyhello-common/${{ matrix.platform }} \
                       -path '*/build/libs/*.jar' | sort); do
            echo "== $jar"
            jar tf "$jar" | head -20
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            platforms/${{ matrix.platform }}/*/build/libs/*.jar
            examples/*/${{ matrix.platform }}/build/libs/*.jar
          if-no-files-found: error

  # Launch smoke tests. These need a real Minecraft client or dedicated server, which in
  # turn needs a display, a licence and (for the server) an accepted EULA. They are
  # therefore opt-in and off by default; when they cannot run, the matrix cell is recorded
  # as "blocked" in docs/testing.md rather than as passed.
  launch:
    name: Launch ${{ matrix.platform }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.allow_eula == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fabric-1.21.1
            mode: dedicated-server
            java: "25"
            gradle: "9.9.0"
          - platform: fabric-26.3
            mode: dedicated-server
            java: "25"
            gradle: "9.9.0"
          - platform: neoforge-1.21.1
            mode: dedicated-server
            java: "25"
            gradle: "9.6.1"
          - platform: neoforge-26.3
            mode: dedicated-server
            java: "25"
            gradle: "9.6.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Accept the EULA (only possible with allow_eula=true)
        working-directory: platforms/${{ matrix.platform }}
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
      - name: Boot the dedicated server, then stop it
        working-directory: platforms/${{ matrix.platform }}
        run: |
          set -o pipefail
          ( gradle --no-daemon runServer | tee server.log ) &
          pid=$!
          for _ in $(seq 1 120); do
            grep -q 'Done (' server.log 2>/dev/null && break
            sleep 5
          done
          printf 'stop\n' >> run/logs/../stdin 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
      - name: Log marker smoke test
        working-directory: platforms/${{ matrix.platform }}
        run: |
          if grep -q 'Python-for-Minecraft' server.log; then
            echo "PyFM log marker found"
          else
            echo "::error::PyFM log marker missing" && exit 1
          fi
      - name: Note
        run: |
          echo "This job was started explicitly with allow_eula=true and has never been"
          echo "run by the project itself: see docs/testing.md."
          echo "Client launch additionally needs a display and a Minecraft licence,"
          echo "neither of which CI provides."
