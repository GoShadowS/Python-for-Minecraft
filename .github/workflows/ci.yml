name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_eula:
        description: >-
          Permit the launch jobs to accept the Minecraft EULA. Off by default: the project
          never accepts the EULA on the repository owner's behalf.
        type: choice
        default: "false"
        options: ["false", "true"]

permissions:
  contents: read

# The four supported combinations. Nothing in this file may assume one toolchain fits all
# of them: Fabric 1.21.1 and NeoForge 1.21.1 need Java 21, the 26.3 combinations need
# Java 25, and the Fabric and NeoForge builds use different Gradle lines.
jobs:
  # Runs everywhere and needs no JDK: this is what the project can verify without a
  # Minecraft toolchain at all.
  python:
    name: Python suite, vendoring and metadata validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Public API and protocol tests
        working-directory: python
        run: python -m unittest discover -s tests -t . -v
      - name: Reproducible dependency vendoring
        run: |
          python tools/vendor_deps.py --check \
            --requirements examples/pyhello-common/requirements.txt \
            --out examples/pyhello-common/python/vendor
      - name: Mod metadata validation
        run: python tools/validate_metadata.py
      - name: Mod metadata validator self-test
        run: python tools/validate_metadata.py --self-test
      - name: Java source consistency check (no JDK needed)
        run: python tools/check_java.py

  # Gradle builds for all four combinations. Successful build is NOT a successful launch:
  # see docs/testing.md for what each cell of the matrix really proves.
  build:
    name: ${{ matrix.platform }} / ${{ matrix.gradle }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    needs: python
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fabric-1.21.1
            java: "21"
            gradle: "9.8.2"
            loader: fabric
          - platform: fabric-26.3
            java: "25"
            gradle: "9.8.2"
            loader: fabric
          - platform: neoforge-1.21.1
            java: "21"
            gradle: "8.14.5"
            loader: neoforge
          - platform: neoforge-26.3
            java: "25"
            gradle: "8.14.5"
            loader: neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-read-only: false
      - name: Build the three Python-for-Minecraft components
        working-directory: platforms/${{ matrix.platform }}
        run: gradle --no-daemon --stacktrace build
      - name: Build the example Python mods
        working-directory: examples/pyhello-client/${{ matrix.platform }}
        run: gradle --no-daemon --stacktrace build
      - name: Build the common example Python mod
        working-directory: examples/pyhello-common/${{ matrix.platform }}
        run: gradle --no-daemon --stacktrace build
      - name: Inspect the produced jars
        run: |
          set -euo pipefail
          for jar in $(find platforms/${{ matrix.platform }} \
                                examples/pyhello-client/${{ matrix.platform }} \
                                examples/pyhello-common/${{ matrix.platform }} \
                       -path '*/build/libs/*.jar' | sort); do
            echo "== $jar"
            jar tf "$jar" | head -20
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            platforms/${{ matrix.platform }}/*/build/libs/*.jar
            examples/*/${{ matrix.platform }}/build/libs/*.jar
          if-no-files-found: error

  # Launch smoke tests. These need a real Minecraft client or dedicated server, which in
  # turn needs a display, a licence and (for the server) an accepted EULA. They are
  # therefore opt-in and off by default; when they cannot run, the matrix cell is recorded
  # as "blocked" in docs/testing.md rather than as passed.
  launch:
    name: Launch ${{ matrix.platform }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.allow_eula == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fabric-1.21.1
            mode: dedicated-server
            java: "21"
            gradle: "9.8.2"
          - platform: fabric-26.3
            mode: dedicated-server
            java: "25"
            gradle: "9.8.2"
          - platform: neoforge-1.21.1
            mode: dedicated-server
            java: "21"
            gradle: "8.14.5"
          - platform: neoforge-26.3
            mode: dedicated-server
            java: "25"
            gradle: "8.14.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Accept the EULA (only possible with allow_eula=true)
        working-directory: platforms/${{ matrix.platform }}
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
      - name: Boot the dedicated server, then stop it
        working-directory: platforms/${{ matrix.platform }}
        run: |
          set -o pipefail
          ( gradle --no-daemon runServer | tee server.log ) &
          pid=$!
          for _ in $(seq 1 120); do
            grep -q 'Done (' server.log 2>/dev/null && break
            sleep 5
          done
          printf 'stop\n' >> run/logs/../stdin 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
      - name: Log marker smoke test
        working-directory: platforms/${{ matrix.platform }}
        run: |
          if grep -q 'Python-for-Minecraft' server.log; then
            echo "PyFM log marker found"
          else
            echo "::error::PyFM log marker missing" && exit 1
          fi
      - name: Note
        run: |
          echo "This job was started explicitly with allow_eula=true and has never been"
          echo "run by the project itself: see docs/testing.md."
          echo "Client launch additionally needs a display and a Minecraft licence,"
          echo "neither of which CI provides."
