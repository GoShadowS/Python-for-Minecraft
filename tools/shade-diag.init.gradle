// Registers a :pyfm-core:shadeDiag task that prints what the "shade" configuration resolves
// to. shadowJar expands every file in that configuration as a ZIP and hit
// "Cannot expand ZIP .../python-community-25.5.5.0.3.pom", so before trusting any fix this
// records the ground truth.
//
// Resolution happens inside a task, at execution time. Doing it from projectsEvaluated made
// Gradle fail with "Resolution ... was attempted without an exclusive lock".
gradle.projectsEvaluated {
    def core = gradle.rootProject.findProject(':pyfm-core')
    if (core == null) return
    if (core.configurations.findByName('shade') == null) return

    core.tasks.register('shadeDiag') {
        def shade = core.configurations.getByName('shade')
        notCompatibleWithConfigurationCache('diagnostic task')
        doLast {
            def attrs = shade.attributes.keySet().collect { k -> k.name + '=' + shade.attributes.getAttribute(k) }
            println 'SHADEDIAG attributes: ' + (attrs.isEmpty() ? '<none -- legacy default resolution>' : attrs)

            try {
                shade.allDependencies.each { d ->
                    println 'SHADEDIAG declared: ' + d.group + ':' + d.name + ':' + d.version
                }
            } catch (Throwable t) { println 'SHADEDIAG declared: FAILED ' + t }

            try {
                shade.incoming.resolutionResult.allComponents { c ->
                    println 'SHADEDIAG component: ' + c.moduleVersion
                }
            } catch (Throwable t) { println 'SHADEDIAG component: FAILED ' + t }

            try {
                def arts = shade.incoming.artifactView { it.lenient(true) }.artifacts
                arts.artifacts.each { a ->
                    println 'SHADEDIAG artifact: ' + a.id.componentIdentifier + ' file=' + a.file.name
                }
                def fails = arts.failures.collect { it.toString() }
                println 'SHADEDIAG artifact failures: ' + (fails.isEmpty() ? '<none>' : fails)
            } catch (Throwable t) { println 'SHADEDIAG artifact: FAILED ' + t }

            try {
                def files = shade.files
                println 'SHADEDIAG file count: ' + files.size()
                def bad = files.findAll { !it.name.endsWith('.jar') }
                println 'SHADEDIAG non-jar files shadow would try to expand: ' + (bad.isEmpty() ? '<none>' : bad.collect { it.name })
            } catch (Throwable t) { println 'SHADEDIAG files: FAILED ' + t }
        }
    }
}
