// Reproduction of the fabric-26.3 "Provider jar not found" failure, printed from inside the
// JVM and classloader where it actually happens.
//
// The throwing frame (run 42986520306) is
//   java.nio.file.ProviderNotFoundException: Provider "jar" not found
//     at net.fabricmc.tinyremapper.FileSystemReference.open(FileSystemReference.java:74)
//     at net.fabricmc.tinyremapper.FileSystemReference.openJar(FileSystemReference.java:48)
//     at net.fabricmc.loom.util.FileSystemUtil.getJarFileSystem(FileSystemUtil.java:121)
//     at net.fabricmc.loom.util.ZipUtils.unpack(ZipUtils.java:111)
//     at net.fabricmc.loom.util.fmj.FabricModJsonFactory.createFromZipNullable(...)
//     at net.fabricmc.loom.configuration.DeobfSpecContext.getModsFromConfiguration(...)
//     at net.fabricmc.loom.configuration.CompileConfiguration.lambda$run$1(...)
//     at net.fabricmc.loom.util.gradle.GradleUtils.lambda$afterSuccessfulEvaluation$0(...)
//
// ProviderNotFoundException (rather than FileSystemNotFoundException) means the three
// argument FileSystems.newFileSystem(URI, Map, ClassLoader) overload was used, so the
// classloader argument is part of the answer. This hook is registered on projectsLoaded,
// i.e. before any build script is evaluated, which puts its afterEvaluate callback ahead of
// the one Loom registers -- so the state is printed immediately before Loom throws.
gradle.projectsLoaded {
    def report = { label ->
        println 'REPRO ' + label + ' installed schemes: ' +
                java.nio.file.spi.FileSystemProvider.installedProviders()*.scheme
    }
    report('projectsLoaded')
    println 'REPRO TCCL=' + Thread.currentThread().contextClassLoader
    println 'REPRO systemCL=' + ClassLoader.getSystemClassLoader()
    println 'REPRO jdk.zipfs in boot layer=' +
            java.lang.ModuleLayer.boot().modules().any { it.name == 'jdk.zipfs' }

    gradle.allprojects { p ->
        p.afterEvaluate {
            println 'REPRO ' + p.path + ' afterEvaluate, schemes=' +
                    java.nio.file.spi.FileSystemProvider.installedProviders()*.scheme
            println 'REPRO ' + p.path + ' TCCL=' + Thread.currentThread().contextClassLoader
            println 'REPRO ' + p.path + ' buildscript CL=' + p.buildscript.classLoader

            // A synthetic jar is enough: the failure is about resolving the "jar" scheme,
            // not about the file's contents.
            def tmp = java.io.File.createTempFile('pyfm-repro', '.jar')
            new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(tmp)).close()
            try {
                def fileUri = tmp.toPath().toUri()

                // A: two-argument overload, URI.create form.
                try {
                    def fs = java.nio.file.FileSystems.newFileSystem(
                            java.net.URI.create('jar:' + fileUri), [:])
                    println 'REPRO ' + p.path + ' A newFileSystem(URI,Map) -> OK'
                    fs.close()
                } catch (Throwable t) {
                    println 'REPRO ' + p.path + ' A -> FAILED ' + t
                }

                // B: three-argument overload with this thread's context classloader, the
                // form whose failure message matches the one Loom produced.
                try {
                    def fs = java.nio.file.FileSystems.newFileSystem(
                            java.net.URI.create('jar:' + fileUri), [:],
                            Thread.currentThread().contextClassLoader)
                    println 'REPRO ' + p.path + ' B newFileSystem(URI,Map,TCCL) -> OK'
                    fs.close()
                } catch (Throwable t) {
                    println 'REPRO ' + p.path + ' B -> FAILED ' + t
                }

                // C: tiny-remapper itself, through the classloader that loaded Loom.
                def openJar = { path, label ->
                    try {
                        def cls = Class.forName('net.fabricmc.tinyremapper.FileSystemReference',
                                true, p.buildscript.classLoader)
                        def ref = cls.getMethod('openJar', java.nio.file.Path)
                                .invoke(null, path)
                        println 'REPRO ' + p.path + ' ' + label + ' openJar(' + path + ') -> OK'
                        ref.close()
                    } catch (Throwable t) {
                        def cause = t
                        while (cause.cause != null) cause = cause.cause
                        println 'REPRO ' + p.path + ' ' + label + ' openJar(' + path + ') ' +
                                '-> FAILED ' + cause.class.name + ': ' + cause.message
                        cause.stackTrace.take(6).each { println 'REPRO   at ' + it }
                    }
                }
                openJar(tmp.toPath(), 'C plain-jar')

                // D: the swallow hypothesis. JDK 21 FileSystems.newFileSystem(URI, Map) is
                // "return newFileSystem(uri, env, null)", and that overload loops over
                // installedProviders() doing
                //     try { return provider.newFileSystem(uri, env); }
                //     catch (UnsupportedOperationException uoe) { }
                // before throwing ProviderNotFoundException. So a provider that is installed
                // but refuses this URI still produces "Provider jar not found". Ask the jar
                // provider directly and show what it really says.
                def jarProvider = java.nio.file.spi.FileSystemProvider.installedProviders()
                        .find { it.scheme == 'jar' }
                try {
                    def fs = jarProvider.newFileSystem(
                            java.net.URI.create('jar:' + tmp.toPath().toUri()), [:])
                    println 'REPRO ' + p.path + ' D jarProvider.newFileSystem -> OK'
                    fs.close()
                } catch (Throwable t) {
                    println 'REPRO ' + p.path + ' D jarProvider.newFileSystem -> ' +
                            t.class.name + ': ' + t.message
                }

                // E: a jar nested inside another jar. Minecraft 26.3 is unobfuscated, so
                // Loom reaches the mods through a different path than on 1.21.1, and a
                // Path inside an open jar FileSystem is what would make toJarUri build a
                // "jar:jar:..." URI.
                def outer = java.io.File.createTempFile('pyfm-outer', '.jar')
                def zo = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(outer))
                zo.putNextEntry(new java.util.zip.ZipEntry('inner.jar'))
                zo.write(tmp.bytes)
                zo.closeEntry()
                zo.close()
                def outerFs = java.nio.file.FileSystems.newFileSystem(
                        java.net.URI.create('jar:' + outer.toPath().toUri()), [:])
                try {
                    def nested = outerFs.getPath('inner.jar')
                    println 'REPRO ' + p.path + ' E nested uri=' + nested.toUri()
                    openJar(nested, 'E nested-jar')
                } catch (Throwable t) {
                    println 'REPRO ' + p.path + ' E -> ' + t.class.name + ': ' + t.message
                } finally {
                    outerFs.close()
                    outer.delete()
                }

                // F: the jars Loom is actually iterating when it throws, i.e. the resolved
                // mod dependencies of this project.
                ['modImplementation', 'implementation'].each { confName ->
                    def conf = p.configurations.findByName(confName)
                    if (conf == null) return
                    try {
                        conf.resolvedConfiguration.lenientConfiguration.artifacts
                                .each { art ->
                            if (!art.file.name.endsWith('.jar')) return
                            openJar(art.file.toPath(), 'F ' + confName + ':' + art.file.name)
                        }
                    } catch (Throwable t) {
                        println 'REPRO ' + p.path + ' F ' + confName + ' resolve -> ' +
                                t.class.name + ': ' + t.message
                    }
                }
            } finally {
                tmp.delete()
            }
        }
    }
}

// Also usable as a standalone task on a project that does configure successfully.
gradle.projectsLoaded {
    gradle.rootProject.tasks.register('jarFsRepro') {
        notCompatibleWithConfigurationCache('diagnostic task')
        doLast { println 'REPRO task jarFsRepro ran on ' + project.path }
    }
}
